<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sanya & Ritesh — Wedding Invitation</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f7e9e9;font-family:Georgia,serif;color:#5a241d}
header{position:sticky;top:0;z-index:5;text-align:center;padding:10px;background:rgba(255,248,248,.94);font-family:Arial,sans-serif;font-size:13px;box-shadow:0 2px 10px #0001}
main{max-width:560px;margin:0 auto;padding:12px 10px 30px}
.page{position:relative;width:100%;margin:0 auto 14px;line-height:0;box-shadow:0 4px 18px #5b182522}
.page img{display:block;width:100%;height:auto}
.scratch-area{position:absolute;left:4%;top:25%;width:92%;height:65%;touch-action:none;overflow:hidden;border-radius:5px}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#555;font:600 clamp(15px,4vw,23px)/1.5 Arial,sans-serif;pointer-events:none;text-shadow:0 1px #fff}
.hint small{font-size:clamp(11px,3vw,15px);font-weight:500}
.actions{text-align:center;padding:8px 0 20px;font:14px Arial,sans-serif}
button{border:0;border-radius:24px;background:#8c3e1d;color:#fff;padding:12px 22px;font-weight:600}
.note{color:#76534a;margin:9px auto;max-width:420px;line-height:1.45}
</style></head>
<body>
<header>✨ SANYA &amp; RITESH — WEDDING INVITATION ✨<br>Scroll down and scratch page 3 to reveal the date</header>
<main id="pages"></main>
<div class="actions"><button onclick="location.reload()">Reset invitation</button><div class="note">Use your finger to rub the silver panel on the “Save the Date” page. The date underneath will appear.</div></div>
<script>
const holder=document.getElementById('pages');
for(let i=1;i<=9;i++){
 const section=document.createElement('section');section.className='page';
 const img=document.createElement('img');img.src=`pages/page-${i}.jpg`;img.alt=`Wedding invitation page ${i}`;section.appendChild(img);
 if(i===3){
  const area=document.createElement('div');area.className='scratch-area';
  const canvas=document.createElement('canvas');canvas.setAttribute('aria-label','Scratch to reveal wedding date');area.appendChild(canvas);
  const hint=document.createElement('div');hint.className='hint';hint.innerHTML='✦ SCRATCH HERE ✦<small>Use your finger to reveal the wedding date</small>';area.appendChild(hint);
  section.appendChild(area);
  const ctx=canvas.getContext('2d');let drawing=false;let scratched=0;
  function setup(){
   const rect=area.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);
   canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);
   ctx.setTransform(dpr,0,0,dpr,0,0);
   const w=rect.width,h=rect.height;
   const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#eeeeee');g.addColorStop(.22,'#b9b9b9');g.addColorStop(.48,'#f8f8f8');g.addColorStop(.72,'#a9a9a9');g.addColorStop(1,'#e4e4e4');
   ctx.globalCompositeOperation='source-over';ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
   for(let j=0;j<1600;j++){ctx.fillStyle=`rgba(70,70,70,${Math.random()*.12})`;ctx.fillRect(Math.random()*w,Math.random()*h,1.2,1.2)}
   ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.strokeRect(2,2,w-4,h-4);
   ctx.fillStyle='#666';ctx.textAlign='center';ctx.font='bold 20px Arial';ctx.fillText('SCRATCH TO REVEAL',w/2,h/2-5);
   ctx.font='13px Arial';ctx.fillText('A special date is waiting for you',w/2,h/2+22);
   ctx.globalCompositeOperation='destination-out';
  }
  function point(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
  function scratch(e){if(!drawing)return;const p=point(e);ctx.beginPath();ctx.arc(p.x,p.y,22,0,Math.PI*2);ctx.fill();scratched++;if(scratched%12===0){let data=ctx.getImageData(0,0,canvas.width,canvas.height).data,clear=0;for(let k=3;k<data.length;k+=16)if(data[k]<30)clear++;if(clear/(data.length/16)>.38){canvas.style.transition='opacity .5s';canvas.style.opacity='0';setTimeout(()=>{canvas.style.display='none';hint.style.display='none'},550)}}}
  canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);scratch(e)});
  canvas.addEventListener('pointermove',scratch);
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>canvas.addEventListener(ev,()=>drawing=false));
  img.addEventListener('load',setup);if(img.complete)setup();
  window.addEventListener('resize',()=>{if(canvas.style.display!=='none')setup()});
 }
 holder.appendChild(section);
}
</script></body></html>
